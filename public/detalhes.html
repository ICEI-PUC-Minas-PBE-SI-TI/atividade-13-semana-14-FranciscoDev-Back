<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detalhe da Notícia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="./assets/css/styles.css">
<link rel="stylesheet" href="./assets/css/detalhes.css">
</head>

<body>

  <header class="bg-dark text-white p-3">
    <div class="container">
      <h1>RadarFut</h1>
    </div>
  </header>

  <main class="container mt-5">

    <section class="noticia-detalhe">

      <h1 id="titulo" class="mb-4"></h1>

      <img id="imagem" class="img-fluid rounded mb-4 detalhe-img">

      <div class="info-noticia mb-4">

        <p><strong>Campeonato:</strong> <span id="campeonato"></span></p>

        <p><strong>Data:</strong> <span id="data"></span></p>

        <p><strong>Autor:</strong> <span id="autor"></span></p>

        <p><strong>Time:</strong> <span id="time"></span></p>

        <p><strong>Assunto:</strong> <span id="assunto"></span></p>

      </div>

      <p id="conteudo" class="conteudo-noticia"></p>

    </section>

   <section class="mt-5">

  <h3 class="text-white mb-4">Mais notícias</h3>

  <div class="row g-4" id="outrasNoticias"></div>

</section>

  </main>

  <script src="./assets/scripts/app.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search)

    const id = params.get("id")

    const noticia = dados.noticias.find(n => n.id == id)

    document.getElementById("titulo").innerText = noticia.titulo

    document.getElementById("conteudo").innerText = noticia.conteudo

    document.getElementById("imagem").src = noticia.imagem

    document.getElementById("campeonato").innerText = noticia.campeonato

    document.getElementById("data").innerText = noticia.data

    document.getElementById("autor").innerText = noticia.autor

    document.getElementById("time").innerText = noticia.time

    document.getElementById("assunto").innerText = noticia.assunto

   const outrasNoticias = document.getElementById("outrasNoticias")

dados.noticias.forEach(n => {

  if(n.id != noticia.id){

    outrasNoticias.innerHTML += `

    <div class="col-12 col-sm-6 col-lg-3">

      <div class="card h-100">

        <img src="${n.imagem}" class="card-img-top">

        <div class="card-body d-flex flex-column">

          <h5>${n.titulo}</h5>

          <p>${n.descricao}</p>

          <a href="detalhes.html?id=${n.id}" 
          class="btn btn-success mt-auto"
          target="_blank">

            Ver mais

          </a>

        </div>

      </div>

    </div>
    `
  }

})

  </script>

</body>

</html>
